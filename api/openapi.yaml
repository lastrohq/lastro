openapi: 3.0.3
info:
  title: Lastro
  version: 0.1.0
  description: |
    API do Lastro, o gateway Pix self-hosted.

    As rotas Pix (`/cob`, `/cobv`...) são **compatíveis com a API Pix do Banco
    Central** (spec v2.10.0): mesmo caminho, mesmos campos, mesmo formato de
    erro. Quem já tem cliente escrito contra a spec troca a URL base e a
    autenticação. Este arquivo é escrito pelo Lastro — não é cópia da spec do BCB.

    O que o Lastro **acrescenta** à spec vem marcado com `x-lastro: true`:
    o header `Idempotency-Key` e o campo `expirada`, por exemplo.

    Rotas que não existem na spec (contas, API keys, administração) vivem em
    `/lastro/v1/...` (ADR-003).

    Dinheiro trafega como string decimal com exatamente duas casas (`"10.50"`).
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:8080

security:
  - apiKey: []

tags:
  - name: Cob
    description: Cobrança imediata.
  - name: CobV
    description: Cobrança com vencimento.
  - name: Rec
    description: >-
      Pix Automático: recorrência e solicitação de confirmação (RN-40, RN-41). A API
      key precisa ser restrita a uma conta: ela identifica o recebedor, como a
      credencial do cliente na spec do BCB.
  - name: Lastro
    description: Rotas do Lastro, fora da spec do BCB.
  - name: Webhooks
    description: Rotas chamadas pelos bancos.

paths:
  /health:
    get:
      tags: [Lastro]
      operationId: health
      summary: Saúde da instância
      security: []
      responses:
        "200":
          description: A instância está no ar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /cob/{txid}:
    parameters:
      - $ref: "#/components/parameters/TxidPath"
    put:
      tags: [Cob]
      operationId: criarCobComTxid
      summary: Criar cobrança imediata com txid definido pelo cliente
      description: O txid já identifica a criação, então `Idempotency-Key` é opcional aqui (RN-11).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyOpcional"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CobSolicitada"
      responses:
        default:
          $ref: "#/components/responses/Erro"
        "201":
          description: Cobrança criada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CobGerada"
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/AcessoNegado"
        "409":
          $ref: "#/components/responses/Conflito"
        "501":
          $ref: "#/components/responses/NaoSuportado"
    patch:
      tags: [Cob]
      operationId: revisarCob
      summary: Revisar cobrança imediata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CobRevisada"
      responses:
        default:
          $ref: "#/components/responses/Erro"
        "200":
          description: Cobrança revisada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CobGerada"
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/AcessoNegado"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          $ref: "#/components/responses/Conflito"
    get:
      tags: [Cob]
      operationId: consultarCob
      summary: Consultar cobrança imediata
      parameters:
        - name: revisao
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
      responses:
        default:
          $ref: "#/components/responses/Erro"
        "200":
          description: Cobrança encontrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CobCompleta"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/AcessoNegado"
        "404":
          $ref: "#/components/responses/NaoEncontrado"

  /rec:
    post:
      tags: [Rec]
      operationId: criarRec
      summary: Criar recorrência de Pix Automático
      description: >-
        O idRec é gerado pelo PSP da conta. Exige API key restrita a uma conta.
        Responde 501 se o banco da conta não oferece Pix Automático.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecSolicitada"
      responses:
        default:
          $ref: "#/components/responses/Erro"
        "201":
          description: Recorrência criada, com status CRIADA.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecGerada"
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/AcessoNegado"
        "501":
          $ref: "#/components/responses/NaoSuportado"

  /rec/{idRec}:
    get:
      tags: [Rec]
      operationId: consultarRec
      summary: Consultar recorrência
      parameters:
        - $ref: "#/components/parameters/IdRecPath"
      responses:
        default:
          $ref: "#/components/responses/Erro"
        "200":
          description: Recorrência.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecGerada"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/AcessoNegado"
        "404":
          $ref: "#/components/responses/NaoEncontrado"

  /solicrec:
    post:
      tags: [Rec]
      operationId: criarSolicRec
      summary: Pedir a confirmação da recorrência no app do pagador (jornada 1)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicRecSolicitada"
      responses:
        default:
          $ref: "#/components/responses/Erro"
        "201":
          description: Solicitação criada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolicRecGerada"
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/AcessoNegado"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "501":
          $ref: "#/components/responses/NaoSuportado"

  /cob:
    post:
      tags: [Cob]
      operationId: criarCob
      summary: Criar cobrança imediata com txid gerado pelo Lastro
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CobSolicitada"
      responses:
        default:
          $ref: "#/components/responses/Erro"
        "201":
          description: Cobrança criada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CobGerada"
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/AcessoNegado"
        "409":
          $ref: "#/components/responses/Conflito"
        "501":
          $ref: "#/components/responses/NaoSuportado"
    get:
      tags: [Cob]
      operationId: listarCobs
      summary: Listar cobranças imediatas
      parameters:
        - $ref: "#/components/parameters/Inicio"
        - $ref: "#/components/parameters/Fim"
        - $ref: "#/components/parameters/CpfFiltro"
        - $ref: "#/components/parameters/CnpjFiltro"
        - name: locationPresente
          in: query
          schema:
            type: boolean
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/CobStatus"
        - $ref: "#/components/parameters/PaginaAtual"
        - $ref: "#/components/parameters/ItensPorPagina"
      responses:
        default:
          $ref: "#/components/responses/Erro"
        "200":
          description: Página de cobranças.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CobsConsultadas"
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/AcessoNegado"

  /cobv/{txid}:
    parameters:
      - $ref: "#/components/parameters/TxidPath"
    put:
      tags: [CobV]
      operationId: criarCobv
      summary: Criar cobrança com vencimento
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyOpcional"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CobVSolicitada"
      responses:
        default:
          $ref: "#/components/responses/Erro"
        "201":
          description: Cobrança criada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CobVGerada"
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/AcessoNegado"
        "409":
          $ref: "#/components/responses/Conflito"
        "501":
          $ref: "#/components/responses/NaoSuportado"
    patch:
      tags: [CobV]
      operationId: revisarCobv
      summary: Revisar cobrança com vencimento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CobVRevisada"
      responses:
        default:
          $ref: "#/components/responses/Erro"
        "200":
          description: Cobrança revisada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CobVGerada"
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/AcessoNegado"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          $ref: "#/components/responses/Conflito"
    get:
      tags: [CobV]
      operationId: consultarCobv
      summary: Consultar cobrança com vencimento
      parameters:
        - name: revisao
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
      responses:
        default:
          $ref: "#/components/responses/Erro"
        "200":
          description: Cobrança encontrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CobVCompleta"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/AcessoNegado"
        "404":
          $ref: "#/components/responses/NaoEncontrado"

  /cobv:
    get:
      tags: [CobV]
      operationId: listarCobvs
      summary: Listar cobranças com vencimento
      parameters:
        - $ref: "#/components/parameters/Inicio"
        - $ref: "#/components/parameters/Fim"
        - $ref: "#/components/parameters/CpfFiltro"
        - $ref: "#/components/parameters/CnpjFiltro"
        - name: locationPresente
          in: query
          schema:
            type: boolean
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/CobVStatus"
        - $ref: "#/components/parameters/PaginaAtual"
        - $ref: "#/components/parameters/ItensPorPagina"
      responses:
        default:
          $ref: "#/components/responses/Erro"
        "200":
          description: Página de cobranças.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CobVsConsultadas"
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/AcessoNegado"

  /lastro/v1/contas:
    post:
      tags: [Lastro]
      operationId: criarConta
      summary: Cadastrar conta recebedora
      description: |
        Exige o escopo `conta:admin`. As credenciais são cifradas antes de gravar
        (RN-61) e **nunca** voltam em resposta nenhuma. Use só sobre TLS.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContaSolicitada"
      responses:
        default:
          $ref: "#/components/responses/Erro"
        "201":
          description: Conta criada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conta"
    get:
      tags: [Lastro]
      operationId: listarContas
      summary: Listar contas
      responses:
        default:
          $ref: "#/components/responses/Erro"
        "200":
          description: Contas da instância.
          content:
            application/json:
              schema:
                type: object
                required: [contas]
                properties:
                  contas:
                    type: array
                    items:
                      $ref: "#/components/schemas/Conta"

  /lastro/v1/contas/{id}:
    parameters:
      - $ref: "#/components/parameters/ContaIdPath"
    get:
      tags: [Lastro]
      operationId: consultarConta
      summary: Consultar conta
      responses:
        default:
          $ref: "#/components/responses/Erro"
        "200":
          description: Conta encontrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conta"

  /lastro/v1/contas/{id}/desativar:
    parameters:
      - $ref: "#/components/parameters/ContaIdPath"
    post:
      tags: [Lastro]
      operationId: desativarConta
      summary: Desativar conta
      description: Novas cobranças passam a ser recusadas; as existentes continuam valendo.
      responses:
        default:
          $ref: "#/components/responses/Erro"
        "200":
          description: Conta desativada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conta"

  /webhooks/pix/{contaId}/{token}:
    parameters:
      - $ref: "#/components/parameters/ContaIdWebhook"
      - $ref: "#/components/parameters/TokenWebhook"
    post:
      tags: [Webhooks]
      operationId: receberWebhookPix
      summary: Aviso de Pix recebido, enviado pelo banco
      description: |
        Chamada pelo **banco**, não pela sua aplicação. A URL (com o token) é
        gerada por `lastro conta webhook` e registrada no PSP. O corpo segue o
        callback da spec do BCB (`{"pix": [...]}`); bancos que desviam são
        tratados pelo adapter da conta. Responde 200 só depois de gravar (RN-30).
      security: []
      requestBody:
        $ref: "#/components/requestBodies/WebhookPix"
      responses:
        default:
          $ref: "#/components/responses/Erro"
        "200":
          description: Pix gravados (os repetidos são ignorados).

  /webhooks/pix/{contaId}/{token}/pix:
    parameters:
      - $ref: "#/components/parameters/ContaIdWebhook"
      - $ref: "#/components/parameters/TokenWebhook"
    post:
      tags: [Webhooks]
      operationId: receberWebhookPixComSufixo
      summary: O mesmo aviso, com o /pix que a spec manda o banco acrescentar
      security: []
      requestBody:
        $ref: "#/components/requestBodies/WebhookPix"
      responses:
        default:
          $ref: "#/components/responses/Erro"
        "200":
          description: Pix gravados (os repetidos são ignorados).

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: "API key do Lastro, com escopos (RN-60). Envie `Authorization: Bearer lst_...`"

  requestBodies:
    WebhookPix:
      required: true
      content:
        application/json:
          schema:
            type: object
            description: Callback da spec do BCB. Aceito como objeto livre porque quem interpreta é o adapter do banco.

  parameters:
    ContaIdWebhook:
      name: contaId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
    TokenWebhook:
      name: token
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-f]{48}$"
    ContaIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
    IdRecPath:
      name: idRec
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/IdRec"
    TxidPath:
      name: txid
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Txid"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Reenvio com a mesma chave em até 24 h devolve a resposta original (RN-11).
      x-lastro: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
    IdempotencyKeyOpcional:
      name: Idempotency-Key
      in: header
      required: false
      description: Reenvio com a mesma chave em até 24 h devolve a resposta original (RN-11).
      x-lastro: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
    Inicio:
      name: inicio
      in: query
      required: true
      schema:
        type: string
        format: date-time
    Fim:
      name: fim
      in: query
      required: true
      schema:
        type: string
        format: date-time
    CpfFiltro:
      name: cpf
      in: query
      schema:
        $ref: "#/components/schemas/Cpf"
    CnpjFiltro:
      name: cnpj
      in: query
      schema:
        $ref: "#/components/schemas/Cnpj"
    PaginaAtual:
      name: paginacao.paginaAtual
      in: query
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    ItensPorPagina:
      name: paginacao.itensPorPagina
      in: query
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 1000
        default: 100

  responses:
    Erro:
      description: |
        Qualquer outro erro, sempre como `Problema`. Os mais comuns: `502` quando o
        banco recusa ou falha (`PSPIndisponivel`) e `500` para erro interno.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    RequisicaoInvalida:
      description: Requisição fora do formato ou violando uma regra de negócio.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    NaoAutenticado:
      description: API key ausente ou inválida.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    AcessoNegado:
      description: A API key não tem o escopo necessário.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    NaoEncontrado:
      description: Recurso não encontrado.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    Conflito:
      description: txid já existe, revisão desatualizada, ou Idempotency-Key reutilizada com outro payload.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    NaoSuportado:
      description: O PSP da conta não oferece essa capacidade (RN-50).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"

  schemas:
    Conta:
      type: object
      required: [id, nome, psp, chave, ambiente, ativa]
      properties:
        id:
          type: string
        nome:
          type: string
        psp:
          type: string
        chave:
          $ref: "#/components/schemas/Chave"
        ambiente:
          type: string
          enum: [homologacao, producao]
        ativa:
          type: boolean
        certificado:
          $ref: "#/components/schemas/ContaCertificado"
    ContaCertificado:
      type: object
      description: >-
        Dados públicos do certificado do mTLS, conferido no cadastro (RN-62). O
        certificado e a chave privada nunca saem do Lastro. Ausente se a conta não
        tiver certificado.
      required: [sujeito, impressaoDigital, validade]
      properties:
        sujeito:
          type: string
          example: CN=loja.example.com,O=Loja
        impressaoDigital:
          type: string
          description: SHA-256 do certificado (DER), em hexadecimal minúsculo.
          pattern: "^[0-9a-f]{64}$"
        validade:
          type: string
          format: date-time
          description: Fim da validade (NotAfter), em UTC.
    ContaSolicitada:
      type: object
      required: [id, nome, psp, chave, ambiente]
      properties:
        id:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
        nome:
          type: string
          minLength: 1
        psp:
          type: string
          minLength: 1
        chave:
          $ref: "#/components/schemas/Chave"
        ambiente:
          type: string
          enum: [homologacao, producao]
        credenciais:
          type: object
          properties:
            clientId:
              type: string
            clientSecret:
              type: string
            certificado:
              type: string
              format: byte
              description: >-
                Certificado do mTLS em base64: .p12 (com senhaCertificado) ou PEM com
                certificado e chave no mesmo arquivo. É conferido no cadastro: arquivo
                ilegível, senha errada, chave que não corresponde ou certificado vencido
                respondem 400.
            senhaCertificado:
              type: string
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string

    IdRec:
      type: string
      description: Identificador da recorrência, gerado pelo PSP (R + R/N + ISPB + AAAAMMDD + 11 caracteres).
      pattern: "^R[RN][0-9A-Z]{8}[0-9]{8}[a-zA-Z0-9]{11}$"
    RecVinculo:
      type: object
      required: [contrato, devedor]
      properties:
        objeto:
          type: string
          maxLength: 35
        contrato:
          type: string
          minLength: 1
          maxLength: 35
        devedor:
          $ref: "#/components/schemas/Devedor"
    RecCalendario:
      type: object
      required: [dataInicial, periodicidade]
      properties:
        dataInicial:
          type: string
          format: date
        dataFinal:
          type: string
          format: date
        periodicidade:
          type: string
          enum: [SEMANAL, MENSAL, TRIMESTRAL, SEMESTRAL, ANUAL]
    RecValor:
      type: object
      description: >-
        valorRec fixa o valor de toda cobrança. Sem ele, o valor varia, e o pagador
        define um máximo na autorização; valorMinimoRecebedor é o piso desse máximo.
        Os dois são excludentes (RN-40).
      properties:
        valorRec:
          $ref: "#/components/schemas/Valor"
        valorMinimoRecebedor:
          $ref: "#/components/schemas/Valor"
    RecSolicitada:
      type: object
      required: [vinculo, calendario, politicaRetentativa]
      properties:
        vinculo:
          $ref: "#/components/schemas/RecVinculo"
        calendario:
          $ref: "#/components/schemas/RecCalendario"
        valor:
          $ref: "#/components/schemas/RecValor"
        politicaRetentativa:
          type: string
          enum: [NAO_PERMITE, PERMITE_3R_7D]
    RecGerada:
      allOf:
        - $ref: "#/components/schemas/RecSolicitada"
        - type: object
          required: [idRec, status]
          properties:
            idRec:
              $ref: "#/components/schemas/IdRec"
            status:
              type: string
              enum: [CRIADA, APROVADA, REJEITADA, EXPIRADA, CANCELADA]
            motivoRejeicao:
              type: string
    SolicRecSolicitada:
      type: object
      required: [idRec, calendario, destinatario]
      properties:
        idRec:
          $ref: "#/components/schemas/IdRec"
        calendario:
          type: object
          required: [dataExpiracaoSolicitacao]
          properties:
            dataExpiracaoSolicitacao:
              type: string
              format: date-time
              description: No futuro e em até 30 dias (RN-41).
        destinatario:
          type: object
          required: [conta, ispbParticipante]
          properties:
            conta:
              type: string
              minLength: 1
              maxLength: 20
            ispbParticipante:
              type: string
              pattern: "^[0-9A-Z]{8}$"
            agencia:
              type: string
              maxLength: 4
    SolicRecGerada:
      allOf:
        - $ref: "#/components/schemas/SolicRecSolicitada"
        - type: object
          required: [idSolicRec, status]
          properties:
            idSolicRec:
              type: string
            status:
              type: string
              enum: [CRIADA, ENVIADA, RECEBIDA, ACEITA, REJEITADA, EXPIRADA, CANCELADA]
    Txid:
      type: string
      pattern: "^[a-zA-Z0-9]{26,35}$"
    Valor:
      type: string
      pattern: "^\\d{1,10}\\.\\d{2}$"
      example: "10.50"
    Cpf:
      type: string
      pattern: "^\\d{11}$"
    Cnpj:
      type: string
      description: Aceita o CNPJ alfanumérico.
      pattern: "^[0-9A-Z]{14}$"
    Chave:
      type: string
      maxLength: 77
      description: Chave Pix do recebedor (telefone, e-mail, CPF/CNPJ ou EVP).

    Problema:
      type: object
      description: Erro no formato da spec do BCB (RFC 7807).
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        correlationId:
          type: string
        violacoes:
          type: array
          items:
            $ref: "#/components/schemas/Violacao"
    Violacao:
      type: object
      properties:
        razao:
          type: string
        propriedade:
          type: string
        valor:
          type: string

    Devedor:
      type: object
      description: Pessoa física (cpf) ou jurídica (cnpj). Informe um dos dois.
      required: [nome]
      properties:
        cpf:
          $ref: "#/components/schemas/Cpf"
        cnpj:
          $ref: "#/components/schemas/Cnpj"
        nome:
          type: string
          maxLength: 200
    DevedorCompleto:
      allOf:
        - $ref: "#/components/schemas/Devedor"
        - type: object
          properties:
            email:
              type: string
            logradouro:
              type: string
              maxLength: 200
            cidade:
              type: string
              maxLength: 200
            uf:
              type: string
              maxLength: 2
            cep:
              type: string
              maxLength: 8
    Recebedor:
      type: object
      properties:
        cpf:
          $ref: "#/components/schemas/Cpf"
        cnpj:
          $ref: "#/components/schemas/Cnpj"
        nome:
          type: string
        nomeFantasia:
          type: string
        logradouro:
          type: string
        cidade:
          type: string
        uf:
          type: string
        cep:
          type: string

    InfoAdicional:
      type: object
      required: [nome, valor]
      properties:
        nome:
          type: string
          maxLength: 50
        valor:
          type: string
          maxLength: 200
    Loc:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          format: int64
        location:
          type: string
        tipoCob:
          type: string
          enum: [cob, cobv]
        criacao:
          type: string
          format: date-time

    CobStatus:
      type: string
      enum: [ATIVA, CONCLUIDA, REMOVIDA_PELO_USUARIO_RECEBEDOR, REMOVIDA_PELO_PSP]
    CobVStatus:
      type: string
      enum: [ATIVA, CONCLUIDA, REMOVIDA_PELO_USUARIO_RECEBEDOR, REMOVIDA_PELO_PSP]

    CobValor:
      type: object
      required: [original]
      properties:
        original:
          $ref: "#/components/schemas/Valor"
        modalidadeAlteracao:
          type: integer
          format: int32
          minimum: 0
          maximum: 1
          default: 0
          description: 1 permite ao pagador alterar o valor.

    CobSolicitada:
      type: object
      required: [calendario, valor, chave]
      properties:
        calendario:
          type: object
          properties:
            expiracao:
              type: integer
              format: int32
              minimum: 1
              default: 86400
              description: Validade em segundos a partir da criação (RN-13).
        devedor:
          $ref: "#/components/schemas/Devedor"
        loc:
          type: object
          properties:
            id:
              type: integer
              format: int64
        valor:
          $ref: "#/components/schemas/CobValor"
        chave:
          $ref: "#/components/schemas/Chave"
        solicitacaoPagador:
          type: string
          maxLength: 140
        infoAdicionais:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/InfoAdicional"

    CobRevisada:
      type: object
      properties:
        calendario:
          type: object
          properties:
            expiracao:
              type: integer
              format: int32
              minimum: 1
        devedor:
          $ref: "#/components/schemas/Devedor"
        loc:
          type: object
          properties:
            id:
              type: integer
              format: int64
        status:
          type: string
          enum: [REMOVIDA_PELO_USUARIO_RECEBEDOR]
        valor:
          $ref: "#/components/schemas/CobValor"
        chave:
          $ref: "#/components/schemas/Chave"
        solicitacaoPagador:
          type: string
          maxLength: 140
        infoAdicionais:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/InfoAdicional"

    CobGerada:
      type: object
      required: [calendario, txid, revisao, status, valor, chave]
      properties:
        calendario:
          type: object
          required: [criacao, expiracao]
          properties:
            criacao:
              type: string
              format: date-time
            expiracao:
              type: integer
              format: int32
        txid:
          $ref: "#/components/schemas/Txid"
        revisao:
          type: integer
          format: int32
          minimum: 0
          description: Começa em 0 e cresce de 1 em 1 a cada alteração.
        devedor:
          $ref: "#/components/schemas/Devedor"
        loc:
          $ref: "#/components/schemas/Loc"
        location:
          type: string
        status:
          $ref: "#/components/schemas/CobStatus"
        valor:
          $ref: "#/components/schemas/CobValor"
        chave:
          $ref: "#/components/schemas/Chave"
        solicitacaoPagador:
          type: string
        infoAdicionais:
          type: array
          items:
            $ref: "#/components/schemas/InfoAdicional"
        pixCopiaECola:
          type: string
          maxLength: 512
        expirada:
          type: boolean
          x-lastro: true
          description: Extensão do Lastro. Na spec a cob continua ATIVA depois de expirar; este campo poupa o cálculo (RN-13).

    CobCompleta:
      allOf:
        - $ref: "#/components/schemas/CobGerada"
        - type: object
          properties:
            pix:
              type: array
              items:
                $ref: "#/components/schemas/Pix"

    CobsConsultadas:
      type: object
      required: [parametros, cobs]
      properties:
        parametros:
          $ref: "#/components/schemas/ParametrosConsulta"
        cobs:
          type: array
          items:
            $ref: "#/components/schemas/CobCompleta"

    CobVValor:
      type: object
      required: [original]
      properties:
        original:
          $ref: "#/components/schemas/Valor"
        multa:
          type: object
          required: [modalidade, valorPerc]
          properties:
            modalidade:
              type: integer
              format: int32
              minimum: 1
              maximum: 2
              description: 1 valor fixo, 2 percentual.
            valorPerc:
              $ref: "#/components/schemas/Valor"
        juros:
          type: object
          required: [modalidade, valorPerc]
          properties:
            modalidade:
              type: integer
              format: int32
              minimum: 1
              maximum: 8
            valorPerc:
              $ref: "#/components/schemas/Valor"
        abatimento:
          type: object
          required: [modalidade, valorPerc]
          properties:
            modalidade:
              type: integer
              format: int32
              minimum: 1
              maximum: 2
            valorPerc:
              $ref: "#/components/schemas/Valor"
        desconto:
          type: object
          required: [modalidade]
          description: Use descontoDataFixa (modalidades 1 e 2) ou valorPerc (3 a 6), nunca os dois.
          properties:
            modalidade:
              type: integer
              format: int32
              minimum: 1
              maximum: 6
            descontoDataFixa:
              type: array
              minItems: 1
              maxItems: 3
              items:
                type: object
                required: [data, valorPerc]
                properties:
                  data:
                    type: string
                    format: date
                  valorPerc:
                    $ref: "#/components/schemas/Valor"
            valorPerc:
              $ref: "#/components/schemas/Valor"

    CalendarioVencimento:
      type: object
      required: [dataDeVencimento]
      properties:
        dataDeVencimento:
          type: string
          format: date
        validadeAposVencimento:
          type: integer
          format: int32
          minimum: 0
          default: 30
          description: Dias corridos após o vencimento em que ainda pode ser paga.

    CobVSolicitada:
      type: object
      required: [calendario, devedor, valor, chave]
      properties:
        calendario:
          $ref: "#/components/schemas/CalendarioVencimento"
        devedor:
          $ref: "#/components/schemas/DevedorCompleto"
        loc:
          type: object
          properties:
            id:
              type: integer
              format: int64
        valor:
          $ref: "#/components/schemas/CobVValor"
        chave:
          $ref: "#/components/schemas/Chave"
        solicitacaoPagador:
          type: string
          maxLength: 140
        infoAdicionais:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/InfoAdicional"

    CobVRevisada:
      type: object
      properties:
        calendario:
          $ref: "#/components/schemas/CalendarioVencimento"
        devedor:
          $ref: "#/components/schemas/DevedorCompleto"
        loc:
          type: object
          properties:
            id:
              type: integer
              format: int64
        status:
          type: string
          enum: [REMOVIDA_PELO_USUARIO_RECEBEDOR]
        valor:
          $ref: "#/components/schemas/CobVValor"
        chave:
          $ref: "#/components/schemas/Chave"
        solicitacaoPagador:
          type: string
          maxLength: 140
        infoAdicionais:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/InfoAdicional"

    CobVGerada:
      type: object
      required: [calendario, txid, revisao, devedor, status, valor, chave]
      properties:
        calendario:
          allOf:
            - $ref: "#/components/schemas/CalendarioVencimento"
            - type: object
              required: [criacao]
              properties:
                criacao:
                  type: string
                  format: date-time
        txid:
          $ref: "#/components/schemas/Txid"
        revisao:
          type: integer
          format: int32
          minimum: 0
        devedor:
          $ref: "#/components/schemas/DevedorCompleto"
        recebedor:
          $ref: "#/components/schemas/Recebedor"
        loc:
          $ref: "#/components/schemas/Loc"
        status:
          $ref: "#/components/schemas/CobVStatus"
        valor:
          $ref: "#/components/schemas/CobVValor"
        chave:
          $ref: "#/components/schemas/Chave"
        solicitacaoPagador:
          type: string
        infoAdicionais:
          type: array
          items:
            $ref: "#/components/schemas/InfoAdicional"
        pixCopiaECola:
          type: string
          maxLength: 512

    CobVCompleta:
      allOf:
        - $ref: "#/components/schemas/CobVGerada"
        - type: object
          properties:
            pix:
              type: array
              items:
                $ref: "#/components/schemas/Pix"

    CobVsConsultadas:
      type: object
      required: [parametros, cobs]
      properties:
        parametros:
          $ref: "#/components/schemas/ParametrosConsulta"
        cobs:
          type: array
          items:
            $ref: "#/components/schemas/CobVCompleta"

    Pix:
      type: object
      required: [endToEndId, valor, horario]
      properties:
        endToEndId:
          type: string
          pattern: "^[a-zA-Z0-9]{32}$"
        txid:
          type: string
        valor:
          $ref: "#/components/schemas/Valor"
        chave:
          $ref: "#/components/schemas/Chave"
        horario:
          type: string
          format: date-time
        infoPagador:
          type: string
          maxLength: 140

    ParametrosConsulta:
      type: object
      required: [inicio, fim, paginacao]
      properties:
        inicio:
          type: string
          format: date-time
        fim:
          type: string
          format: date-time
        cpf:
          $ref: "#/components/schemas/Cpf"
        cnpj:
          $ref: "#/components/schemas/Cnpj"
        locationPresente:
          type: boolean
        status:
          type: string
        paginacao:
          $ref: "#/components/schemas/Paginacao"
    Paginacao:
      type: object
      required: [paginaAtual, itensPorPagina, quantidadeDePaginas, quantidadeTotalDeItens]
      properties:
        paginaAtual:
          type: integer
          minimum: 0
        itensPorPagina:
          type: integer
          minimum: 1
        quantidadeDePaginas:
          type: integer
          minimum: 1
        quantidadeTotalDeItens:
          type: integer
          minimum: 0
